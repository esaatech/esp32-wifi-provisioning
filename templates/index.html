<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Wi-Fi Setup</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f4f8;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 430px;
            margin: 30px auto;
            padding: 24px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 26px;
        }

        .subtitle {
            margin-top: 0;
            margin-bottom: 24px;
            color: #6b7280;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        select,
        input,
        button {
            width: 100%;
            min-height: 46px;
            padding: 11px 12px;
            border-radius: 8px;
            font-size: 16px;
        }

        select,
        input {
            border: 1px solid #cbd5e1;
            background: white;
        }

        input:focus,
        select:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            margin-top: 24px;
            border: none;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.99);
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 8px;
            color: #9a3412;
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
        }

        .device-name {
            margin-bottom: 20px;
            padding: 10px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 14px;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Wi-Fi Setup</h1>

        <p class="subtitle">
            Select the Wi-Fi network that this access-control
            device should use.
        </p>

        <div class="device-name">
            Device: <strong>{{DEVICE_NAME}}</strong>
        </div>

        {{MESSAGE}}

        <form method="POST" action="/connect">
            <label for="ssid">
                Nearby Wi-Fi networks
            </label>

            <select
                id="ssid"
                name="ssid"
                required
            >
                {{NETWORK_OPTIONS}}
            </select>

            <label for="password">
                Wi-Fi password
            </label>

            <input
                id="password"
                name="password"
                type="text"
                placeholder="Enter network password"
                autocomplete="current-password"
            >

            <button type="submit">
                Connect Device
            </button>
        </form>

        <div class="links">
            <a href="/rescan">
                Scan for networks again
            </a>
        </div>

        <div class="footer">
            SBTY Access Control
        </div>
    </main>
</body>
</html>
